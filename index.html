<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solar System Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Stars -->
    <div class="stars"></div>

    <h1>Interactive Solar System Animation</h1>

    <div class="controls">
        <button id="toggleBtn">Pause Animation</button>

        <label for="speedSlider">Orbit Speed:</label>
        <input type="range" id="speedSlider" min="1" max="10" value="5">
    </div>

    <div class="solar-system">

        <div class="sun"></div>


        <!-- Mercury -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury"
                data-name="Mercury"
                data-info="Mercury is the closest planet to the Sun.">
            </div>
        </div>


        <!-- Venus -->
        <div class="orbit venus-orbit">
            <div class="planet venus"
                data-name="Venus"
                data-info="Venus is the hottest planet in our solar system.">
            </div>
        </div>


        <!-- Earth -->
        <div class="orbit earth-orbit">
            <div class="planet earth"
                data-name="Earth"
                data-info="Earth is the only known planet that supports life.">
            </div>
        </div>


        <!-- Mars -->
        <div class="orbit mars-orbit">
            <div class="planet mars"
                data-name="Mars"
                data-info="Mars is known as the Red Planet.">
            </div>
        </div>


        <!-- Jupiter -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter"
                data-name="Jupiter"
                data-info="Jupiter is the largest planet in the solar system.">
            </div>
        </div>


        <!-- Saturn -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn"
                data-name="Saturn"
                data-info="Saturn is famous for its rings.">
            </div>
        </div>


        <!-- Uranus -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus"
                data-name="Uranus"
                data-info="Uranus rotates on its side.">
            </div>
        </div>


        <!-- Neptune -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune"
                data-name="Neptune"
                data-info="Neptune is the farthest planet from the Sun.">
            </div>
        </div>

    </div>


    <!-- Planet Info Card -->
    <div class="info-card" id="infoCard">
        <h2 id="planetName">Planet Name</h2>
        <p id="planetInfo">Planet information will appear here.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
